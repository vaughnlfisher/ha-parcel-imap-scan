scan_now:
  name: Scan now
  description: >-
    Run a full IMAP search over the configured mailbox window and add any
    newly found tracking numbers to the to-do list.
  fields:
    days_back:
      name: Days back
      description: How many days of mail to search (overrides the configured default for this run).
      example: 90
      selector:
        number:
          min: 1
          max: 730
          unit_of_measurement: days
    entry_id:
      name: Config entry
      description: Which Parcel IMAP Scan account to use (defaults to the first configured one).
      selector:
        text:
